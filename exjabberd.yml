###
###              exjabberd configuration file
###
### This file only lists listeners and modules that are actually
### implemented. Anything not implemented yet lives in the commented
### blocks below (it is NOT started, and the server logs a warning
### for any unknown module name).
###
### The parameters used in this configuration file are explained at
###       https://docs.ejabberd.im/admin/configuration
###       https://docs.nxmpps.im/admin/configuration
###
### The configuration file is written in YAML.
### *******************************************************
### *******           !!! WARNING !!!               *******
### *******     YAML IS INDENTATION SENSITIVE       *******
### ******* MAKE SURE YOU INDENT SECTIONS CORRECTLY *******
### *******************************************************
### Refer to http://en.wikipedia.org/wiki/YAML

hosts:
  - localhost

loglevel: info

## If you already have certificates, list them here
# certfiles:
#  - /etc/letsencrypt/live/domain.tld/fullchain.pem
#  - /etc/letsencrypt/live/domain.tld/privkey.pem

listen:
  -
    port: 5222
    ip: "::"
    module: exjabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    # STARTTLS is offered on this port. Whether it is *required*
    # before authentication is controlled by the top-level
    # `starttls_required` option below (default: optional).
  -
    port: 5223
    ip: "::"
    module: exjabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    tls: true
  -
    port: 5269
    ip: "::"
    module: exjabberd_s2s_in
    max_stanza_size: 262144
    shaper: s2s_shaper
  -
    port: 5280
    ip: "::"
    module: exjabberd_http
    # Serves the web admin (/admin), REST API (/api), BOSH
    # (/bosh, /http-bind), XMPP over WebSocket (/ws), HTTP File
    # Upload (/upload) and the captcha endpoint (/captcha).
  -
    port: 5443
    ip: "::"
    module: exjabberd_http
    tls: true
    # The same HTTP stack over TLS (HTTPS + wss), using the server
    # certificate — ejabberd's 5443 listener.
  -
    port: 1883
    ip: "::"
    module: exjabberd_mqtt
    # MQTT broker: v3.1.1 (Fase 6) and v5.0 (Fase 17 — properties,
    # session expiry, shared subscriptions, topic aliases). Options
    # live in the `mqtt:` section below; authentication reuses the
    # XMPP accounts (Auth backend) when a username is given.
## NOT IMPLEMENTED (removed from the active listen list on purpose —
## the old file claimed these ports, but nothing ever listened on them):
##   5443  HTTPS: /admin, /api, /bosh, /captcha, /upload, /ws — the
##         HTTP stack listens on plain HTTP port 5280 instead (see
##         the exjabberd_http entry above); there is no TLS HTTP
##         listener yet, and no captcha endpoint.
##   5280  HTTP: /admin, /.well-known/acme-challenge — /admin exists
##         now; ACME challenge handling does not.
##   5478  STUN/TURN over UDP (+TCP) — implemented in Fase 5
##         (Exjabberd.StunTurn.Server, from the `turn:` section
##         above, not from `listen:`).

s2s_use_starttls: optional

## Auth backend (Fase 8) — which store holds the accounts.
## `mnesia` (default) keeps the current behaviour: SCRAM-SHA-256
## verifier data in the Mnesia `:passwd` table. `sqlite` uses the
## SQLite file below instead (same verifier format, so accounts
## move between backends with `mix exjabberd.auth.migrate` and keep
## working — no password reset). `sql` is a real PostgreSQL backend
## (Fase 16, see `auth_sql:` below). The remaining ejabberd names
## (`ldap`, `anonymous`, `jwt`, `external`, `oauth`, `pam`) are
## recognised; `jwt`, `external` and `oauth` are real backends
## since Fase 16 (see below), `anonymous` works as before, and
## `ldap`/`pam` remain honest stubs; an unknown value warns and
## falls back to `mnesia`.
auth_method: mnesia
# auth_method: sqlite
# auth_method: sql
# auth_method: jwt
# auth_method: oauth
# auth_method: external

## Require STARTTLS before SASL authentication (ejabberd's
## `starttls_required`): when true, SASL mechanisms are not
## advertised on a plaintext stream, <starttls> is marked
## <required/>, and plaintext auth attempts are rejected with a
## policy-violation stream error.
starttls_required: false

## SQLite auth database (only used when `auth_method: sqlite`).
## The file holds SCRAM verifier data only, never cleartext
## passwords, so there are no credentials to configure here. The
## `EXJABBERD_AUTH_SQLITE_PATH` environment variable wins over
## this value when set.
auth_sqlite:
  path: "priv/auth.sqlite3"

## SQL auth database (only used when `auth_method: sql`, Fase 16).
## PostgreSQL is implemented and wire-verified (native protocol
## client, SCRAM-SHA-256 connection auth); MySQL is not implemented.
## Every value can be overridden by an EXJABBERD_AUTH_SQL_* env var.
# auth_sql:
#   server: postgres
#   host: "127.0.0.1"
#   port: 5432
#   database: exjabberd
#   username: exjabberd
#   password: <redacted> # or EXJABBERD_AUTH_SQL_PASSWORD

## Stateless auth backends (Fase 16). JWT: the SASL PLAIN password
## is a JWT signed HS256 with this shared secret, its `sub` claim
## must equal the username (EXJABBERD_AUTH_JWT_SECRET wins).
# auth_jwt_secret: "<shared secret>"
## OAuth: the SASL PLAIN password is an access token, checked
## against this RFC 7662 introspection endpoint
## (EXJABBERD_AUTH_OAUTH_URL wins).
# auth_oauth_url: "http://127.0.0.1:8080/introspect"
## External: ejabberd extauth protocol against this script
## (EXJABBERD_AUTH_EXTERNAL_SCRIPT wins).
# auth_external_script: "/usr/local/bin/extauth.py"

# Dialback secret (XEP-0220): shared by every server in this
# administrative domain; keys are HMAC-SHA256 over it. When absent,
# the server generates a random ephemeral secret at boot (logged as
# a warning) — fine for a single server, but a restart then
# invalidates in-flight dialback exchanges. Set a stable secret in
# production. NEVER commit a production secret to version control.
# s2s_dialback_secret: "change-me-to-a-long-random-secret"

# Map a domain to a host/port without DNS (SRV _xmpp-server._tcp,
# then A/AAAA on 5269, is used otherwise). Used by the two-node
# test setup; leave empty in normal deployments.
# s2s_host_overrides:
#   example.com:
#     host: 127.0.0.1
#     port: 5269

## Clustering (Fase 7) — distributed Erlang, multi-node, same domain.
## `nodes` lists the OTHER nodes of this cluster by Erlang node name
## (short names: `name@hostname`, same host or LAN); this node
## connects to them at boot and retries every 5 s, so a node that
## returns rejoins on its own. `cookie` is the shared Erlang cookie
## — it MUST be identical on every node (or set the
## `EXJABBERD_ERLANG_COOKIE` env var to the same value, which wins
## over this setting). When no cookie is configured anywhere, the
## node's default cookie (~/.erlang.cookie) stays in effect — that
## keeps :rpc tooling working, and Erlang generates that file
## itself when it does not exist yet. A cluster whose nodes do not
## share one cookie cannot form, so set it explicitly in production.
## A node that should SHARE the Mnesia tables (accounts, roster,
## offline, MAM, PubSub) must ALSO boot once with
## `EXJABBERD_CLUSTER_JOIN=<an existing node>` — it then copies the
## cluster schema from that peer. Merely listing a peer in `nodes`
## is enough for session/message routing, but Mnesia stays unshared
## when both sides already have independent schemas (see README).
## NEVER commit a production cookie to version control.
cluster:
  enabled: true
  nodes: []
  # cookie: "change-me-to-a-long-random-secret"

## HTTP stack (admin web, BOSH, WebSocket, file upload, REST API).
## `api_token` is the REST API Bearer token; `upload_secret` signs
## upload URLs and admin session cookies. The values below are DEV
## placeholders — change them in production, and NEVER commit a
## production secret. When `upload_secret` is empty, the server
## generates a random ephemeral secret per boot (upload URLs then
## stop working after a restart). Admin login uses a real XMPP
## account listed in the `admin` ACL below — there is no separate
## admin password to configure here.
http:
  api_token: "dev-api-token-change-me"
  upload_secret: ""
  upload_dir: "priv/uploads"
  upload_max_size: 10485760
  upload_quota: 104857600
  upload_expiry_seconds: 3600
  upload_url_base: ""
  bosh_wait: 60
  bosh_inactivity: 60
  ## ACME http-01 challenges served at /.well-known/acme-challenge/<token>.
  ## Map token -> key authorization; filled in by your ACME client
  ## during issuance (empty by default):
  acme_challenges: {}

## STUN/TURN (XEP-0215, RFC 5389/5766) — Fase 5. The server listens
## on `port` (UDP + TCP when `tcp: true`); it is NOT a `listen:`
## entry because it speaks STUN/TURN, not XMPP. `host` is the
## address advertised to clients (XEP-0215) and used as the TURN
## realm; `shared_secret` signs the ephemeral TURN credentials
## (username "<expiry>:<bare JID>", password
## Base64(HMAC-SHA1(secret, username))) and authenticates TURN
## allocations (RFC 5389 long-term credential mechanism). The value
## below is a DEV placeholder — change it in production, and NEVER
## commit a production secret. When empty, the server generates a
## random ephemeral secret per boot (TURN credentials then stop
## working after a restart, same as the dialback secret).
turn:
  enabled: true
  port: 5478
  host: "localhost"
  realm: "localhost"
  shared_secret: "dev-only-turn-secret-change-me"
  tcp: true
  default_lifetime: 600
  max_lifetime: 3600
  max_allocations: 500
  # Relay socket binds 0.0.0.0 and advertises the resolved `host`
  # above (127.0.0.1 here). On a public server set `relay_ip` to
  # the public IP (binds + advertises it), or `advertise_ip` to
  # advertise a different address than the bind address.
  # relay_ip: "203.0.113.10"
  # advertise_ip: "203.0.113.10"

## MQTT v3.1.1 broker (Fase 6) — port 1883, from the `listen:` entry
## above. `allow_anonymous: true` accepts CONNECT without a username;
## with a username, the password is checked against the XMPP accounts
## (Auth backend) — there is no separate MQTT password store.
## `bridge` maps MQTT topics to PubSub nodes of the same name, both
## directions; `auto_create_node` creates the node on first publish.
mqtt:
  allow_anonymous: true
  max_payload: 262144
  max_clients: 1000
  max_queued: 100
  bridge:
    enabled: true
    auto_create_node: true
    prefix: ""

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128
  admin:
    user:
      - admin@localhost

access_rules:
  local:
    allow: local
  c2s:
    deny: blocked
    allow: all
  announce:
    allow: admin
  configure:
    allow: admin
  muc_create:
    allow: local
  pubsub_createnode:
    allow: local
  trusted_network:
    allow: loopback

api_permissions:
  "console commands":
    from: ejabberd_ctl
    who: all
    what: "*"
  "webadmin commands":
    from: exjabberd_web_admin
    who: admin
    what: "*"
  "adhoc commands":
    from: mod_adhoc_api
    who: admin
    what: "*"
  "http access":
    from: mod_http_api
    who:
      access:
        allow:
          - acl: loopback
          - acl: admin
      oauth:
        scope: "ejabberd:admin"
        access:
          allow:
            - acl: loopback
            - acl: admin
    what:
      - "*"
      - "!stop"
      - "!start"
  "public commands":
    who:
      ip: 127.0.0.1/8
    what:
      - status
      - connected_users_number

shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast: 100000

shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    5000: admin
    100: all
  c2s_shaper:
    none: admin
    normal: all
  s2s_shaper: fast

modules:
  mod_adhoc: {}
  mod_adhoc_api: {}
  mod_admin_extra: {}
  mod_announce:
    access: announce
  mod_avatar: {}
  mod_blocking: {}
  mod_bosh: {}
  mod_caps: {}
  mod_captcha: {}
  mod_carboncopy: {}
  mod_client_state:
    max_queue: 100
  mod_configure: {}
  mod_disco: {}
  mod_fail2ban: {}
  mod_http_api: {}
  # mod_http_upload serves XEP-0363 slots; the PUT/GET URLs are built
  # from http.upload_url_base (or the HTTP listener) by the HTTP stack.
  # Limits live in the `http:` section above.
  mod_http_upload: {}
  mod_last: {}
  mod_mam:
    ## Mnesia is limited to 2GB, better to use an SQL backend
    ## For small servers SQLite is a good fit and is very easy
    ## to configure. Uncomment this when you have SQL configured:
    ## db_type: sql
    assume_mam_usage: true
    default: always
    # Maximum archived messages kept per user (oldest dropped first).
    max_archive_size: 500
  mod_jingle: {}
  mod_mix: {}
  mod_mqtt: {}
  mod_omemo: {}
  mod_muc:
    access:
      - allow
    access_admin:
      - allow: admin
    access_create: muc_create
    access_persistent: muc_create
    access_mam:
      - allow
    default_room_options:
      mam: true
  mod_muc_admin: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_ping: {}
  mod_privacy: {}
  mod_private: {}
  mod_proxy65:
    access: local
    max_connections: 5
  mod_pubsub:
    access_createnode: pubsub_createnode
    plugins:
      - flat
      - pep
    force_node_config:
      ## Avoid buggy clients to make their bookmarks public
      storage:bookmarks:
        access_model: whitelist
  mod_push: {}
  mod_push_keepalive: {}
  mod_register:
    ## Only accept registration requests from the "trusted"
    ## network (see access_rules section above).
    ip_access: trusted_network
  mod_roster:
    versioning: true
  mod_s2s_bidi: {}
  mod_s2s_dialback: {}
  mod_shared_roster: {}
  mod_stream_mgmt:
    max_ack_queue: 100
    resume_timeout: 60
  mod_stun_disco: {}
  mod_time: {}
  mod_vcard: {}
  mod_vcard_xupdate: {}
  mod_version:
    show_os: false

## NOT IMPLEMENTED YET (kept here as a record, not started):
##   (XEP-0198 stream management, XEP-0280 message carbons and
##   XEP-0352 client state indication are implemented now and listed
##   in `modules:` above.)
## The server logs a warning and skips any module name it cannot resolve.

