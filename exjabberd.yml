###
###              exjabberd configuration file
###
### This file only lists listeners and modules that are actually
### implemented. Anything not implemented yet lives in the commented
### blocks below (it is NOT started, and the server logs a warning
### for any unknown module name).
###
### The parameters used in this configuration file are explained at
###       https://docs.ejabberd.im/admin/configuration
###       https://docs.nxmpps.im/admin/configuration
###
### The configuration file is written in YAML.
### *******************************************************
### *******           !!! WARNING !!!               *******
### *******     YAML IS INDENTATION SENSITIVE       *******
### ******* MAKE SURE YOU INDENT SECTIONS CORRECTLY *******
### *******************************************************
### Refer to http://en.wikipedia.org/wiki/YAML

hosts:
  - localhost

loglevel: info

## If you already have certificates, list them here
# certfiles:
#  - /etc/letsencrypt/live/domain.tld/fullchain.pem
#  - /etc/letsencrypt/live/domain.tld/privkey.pem

listen:
  -
    port: 5222
    ip: "::"
    module: exjabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    # STARTTLS is offered on this port but optional. There is no
    # starttls_required option yet: PLAIN/SCRAM also work without TLS.
  -
    port: 5223
    ip: "::"
    module: exjabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    tls: true
## NOT IMPLEMENTED (removed from the active listen list on purpose —
## the old file claimed these ports, but nothing ever listened on them):
##   5269  S2S inbound (exjabberd_s2s_in) — no S2S listener exists, and
##         federation to other servers is not implemented.
##   5443  HTTPS: /admin, /api, /bosh, /captcha, /upload, /ws — there is
##         no HTTP stack (no Plug/Cowboy/Bandit/Phoenix dependency).
##         BOSH (XEP-0206), file upload (XEP-0363) and the web admin
##         therefore do not exist yet.
##   5280  HTTP: /admin, /.well-known/acme-challenge — same reason.
##   5478  STUN/TURN over UDP — not implemented.
##   1883  MQTT — not implemented.
    module: mod_mqtt
    backlog: 1000

s2s_use_starttls: optional

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128
  admin:
    user:
      - admin@localhost

access_rules:
  local:
    allow: local
  c2s:
    deny: blocked
    allow: all
  announce:
    allow: admin
  configure:
    allow: admin
  muc_create:
    allow: local
  pubsub_createnode:
    allow: local
  trusted_network:
    allow: loopback

api_permissions:
  "console commands":
    from: ejabberd_ctl
    who: all
    what: "*"
  "webadmin commands":
    from: exjabberd_web_admin
    who: admin
    what: "*"
  "adhoc commands":
    from: mod_adhoc_api
    who: admin
    what: "*"
  "http access":
    from: mod_http_api
    who:
      access:
        allow:
          - acl: loopback
          - acl: admin
      oauth:
        scope: "ejabberd:admin"
        access:
          allow:
            - acl: loopback
            - acl: admin
    what:
      - "*"
      - "!stop"
      - "!start"
  "public commands":
    who:
      ip: 127.0.0.1/8
    what:
      - status
      - connected_users_number

shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast: 100000

shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    5000: admin
    100: all
  c2s_shaper:
    none: admin
    normal: all
  s2s_shaper: fast

modules:
  mod_adhoc: {}
  mod_adhoc_api: {}
  mod_admin_extra: {}
  mod_announce:
    access: announce
  mod_avatar: {}
  mod_blocking: {}
  mod_bosh: {}
  mod_caps: {}
  mod_carboncopy: {}
  mod_client_state:
    max_queue: 100
  mod_configure: {}
  mod_disco: {}
  mod_fail2ban: {}
  mod_http_api: {}
  # mod_http_upload is configured but has no HTTP listener to serve it
  # (port 5443 above is not implemented), so file upload does not work
  # yet. Keep the section for when the HTTP stack lands.
  mod_http_upload:
    put_url: https://@HOST@:5443/upload
    custom_headers:
      "Access-Control-Allow-Origin": "https://@HOST@"
      "Access-Control-Allow-Methods": "GET,HEAD,PUT,OPTIONS"
      "Access-Control-Allow-Headers": "Content-Type"
  mod_last: {}
  mod_mam:
    ## Mnesia is limited to 2GB, better to use an SQL backend
    ## For small servers SQLite is a good fit and is very easy
    ## to configure. Uncomment this when you have SQL configured:
    ## db_type: sql
    assume_mam_usage: true
    default: always
    # Maximum archived messages kept per user (oldest dropped first).
    max_archive_size: 500
  mod_mqtt: {}
  mod_muc:
    access:
      - allow
    access_admin:
      - allow: admin
    access_create: muc_create
    access_persistent: muc_create
    access_mam:
      - allow
    default_room_options:
      mam: true
  mod_muc_admin: {}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_ping: {}
  mod_privacy: {}
  mod_private: {}
  mod_proxy65:
    access: local
    max_connections: 5
  mod_pubsub:
    access_createnode: pubsub_createnode
    plugins:
      - flat
      - pep
    force_node_config:
      ## Avoid buggy clients to make their bookmarks public
      storage:bookmarks:
        access_model: whitelist
  mod_push: {}
  mod_push_keepalive: {}
  mod_register:
    ## Only accept registration requests from the "trusted"
    ## network (see access_rules section above).
    ip_access: trusted_network
  mod_roster:
    versioning: true
  mod_s2s_bidi: {}
  mod_s2s_dialback: {}
  mod_shared_roster: {}
  mod_stream_mgmt:
    max_ack_queue: 100
    resume_timeout: 60
  mod_stun_disco: {}
  mod_time: {}
  mod_vcard: {}
  mod_vcard_xupdate: {}
  mod_version:
    show_os: false

## NOT IMPLEMENTED YET (kept here as a record, not started):
##   (XEP-0198 stream management, XEP-0280 message carbons and
##   XEP-0352 client state indication are implemented now and listed
##   in `modules:` above.)
## The server logs a warning and skips any module name it cannot resolve.

### Local Variables:
### mode: yaml
### End:
